name: Sync fork with upstream

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync main with HA-AndersenEV/hassio-andersen-ev
        env:
          # PAT with Contents + Workflows write; GITHUB_TOKEN can't push upstream workflow-file changes.
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::SYNC_TOKEN secret is not set"
            exit 1
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main
